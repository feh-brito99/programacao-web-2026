<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css
    ">
</head>
<body>
    <header>
        <h1>Minhas Tarefas</h1>
    </header>

    <div class="cadastro">
        <form id="form-tarefa">
            <input type="hidden" id="indice-edicao" value="-1">

            <input type="text" id="nome-tarefa" placeholder="Nome da tarefa" required>
            <textarea id="descricao-tarefa" placeholder="Descrição da tarefa (opcional)"></textarea>
            <input type="date" id="prazo-tarefa" required>
            
            <button type="submit" id="btn-submit">Cadastrar Tarefa</button>
        </form>
        <button type="button" id="btn-secundario">Limpar Tudo</button>
    </div>

    <div class="tarefas">
        <ul id="lista-tarefas"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
